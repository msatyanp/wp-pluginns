<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" aria-hidden="true" focusable="false">
  <!--
    Placeholder photo frame — warm cream background with a thin
    gold border echoing the peacock-window lattice aesthetic.
    Replace with real community photos in production.
  -->
  <rect width="400" height="300" fill="#F4EDE0"/>
  <rect x="4" y="4" width="392" height="292" fill="none" stroke="#C89B3C" stroke-width="2" rx="4"/>
  <g transform="translate(200,150)">
    <circle cx="0" cy="-30" r="20" fill="#A6462B" opacity="0.15"/>
    <circle cx="0" cy="-30" r="14" fill="none" stroke="#5A3A29" stroke-width="1"/>
    <circle cx="0" cy="-30" r="6" fill="#5A3A29" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="40" stroke="#5A3A29" stroke-width="2" opacity="0.2"/>
    <line x1="-20" y1="20" x2="20" y2="20" stroke="#5A3A29" stroke-width="1" opacity="0.15"/>
  </g>
  <text x="200" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5A3A29" opacity="0.5">Community Photo</text>
</svg>